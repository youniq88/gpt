<meta charset="utf-8" />
<title>Desktop Buddy</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: "Malgun Gothic", sans-serif;
  }
  /* 크로마키: OBS 등에서 배경을 따내기 위한 순수 초록 배경 */
  body.chroma { background: #00ff00; }
  /* app-region:drag 은 마우스 이벤트를 페이지로 넘겨주지 않아 휠 조절이 막힌다.
     그래서 드래그 이동을 직접 구현한다. */
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: default;
  }
  /* 두 장을 정확히 겹쳐 놓고, 위에 놓인 '입 벌린' 이미지의
     투명도만 음량에 따라 바꾼다. 두 그림은 입 말고는 동일하므로
     이것만으로 자연스러운 립싱크가 된다. */
  #stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #mouth-open, #eyes-closed, #motion { opacity: 0; }

  /* 말할 때: 벌린 입을 보이고 닫은 입을 숨긴다 */
  body.talking #mouth-open { opacity: 1; }
  body.talking #mouth-closed { opacity: 0; }

  /* 깜빡일 때: 감은 눈을 보이고 뜬 눈을 숨긴다 */
  body.blink #eyes-closed { opacity: 1; }
  body.blink #eyes-open { opacity: 0; }

  /* 동작 재생: 배경 캐릭터만 동작 그림으로 바뀌고 입·눈은 그대로 얹힌다 */
  body.motion-on #motion { opacity: 1; }
  body.motion-on #base { visibility: hidden; }

  /* 호환 모드(base.png 없음): 전체 그림 방식이므로 동작 중엔 부품도 숨긴다 */
  body.motion-on.legacy #mouth-closed,
  body.motion-on.legacy #mouth-open,
  body.motion-on.legacy #eyes-open,
  body.motion-on.legacy #eyes-closed { visibility: hidden; }

  #msg {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    padding: 18px; font-size: 12px; line-height: 1.6; color: #fff;
    background: rgba(25,25,25,.88); border-radius: 12px;
  }
</style>

<!-- 레이어 순서(아래→위): 배경 캐릭터/동작 → 입 → 눈.
     base.png(입·눈 없는 배경 캐릭터)가 있으면 완전 부품 모드,
     없으면 예전 방식(mouth-closed.png 가 전체 그림)으로 동작한다. -->
<div id="stage">
  <img id="base"         src="base.png"         alt="" />
  <img id="motion"       alt="" />
  <img id="mouth-closed" src="mouth-closed.png" alt="" />
  <img id="mouth-open"   src="mouth-open.png"   alt="" />
  <img id="eyes-open"    src="eyes-open.png"    alt="" />
  <img id="eyes-closed"  src="eyes-closed.png"  alt="" />
</div>
<div id="msg"></div>

<script>
  const msgEl = document.getElementById('msg');

  function showMsg(html) {
    msgEl.style.display = 'flex';
    msgEl.innerHTML = html;
    // 조작판에도 같은 안내를 보여준다
    window.buddy.sendMsg(html.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, ''));
  }

  // ---- 레이어 이미지 로드 상태 ----
  // 각 레이어는 없으면 조용히 숨긴다. base.png 가 없으면 호환 모드:
  // mouth-closed.png 를 전체 그림으로 취급 (예전 방식).
  const layers = {};
  for (const id of ['base', 'mouth-closed', 'mouth-open', 'eyes-open', 'eyes-closed']) {
    const el = document.getElementById(id);
    layers[id] = { el, ok: true };
    el.onerror = () => {
      layers[id].ok = false;
      el.style.display = 'none';
      if (id === 'base') document.body.classList.add('legacy');
      if (id === 'mouth-closed' || id === 'mouth-open') reportMissing(id + '.png');
    };
  }
  let missing = [];
  function reportMissing(name) {
    missing.push(name);
    showMsg('이미지가 없습니다:<br><b>' + missing.join('<br>') +
            '</b><br><br>desktop-buddy 폴더에<br>같은 이름으로 저장해 주세요.');
  }

  // ---- 손그림 떨림(라인 보일) ----
  // base2.png / base3.png 가 있으면 배경 캐릭터를 여러 프레임으로 번갈아
  // 보여줘서 손으로 여러 번 그린 듯한 떨림을 만든다. 동작 재생 중에는
  // motions/boil/<이름>.2.png, .3.png 가 있으면 동작 그림도 같이 떨린다.
  // 눈·입 부품은 별도 레이어라 떨리지 않는다. 파일이 없으면 조용히 꺼진다.
  const boilFrames = ['base.png'];
  let boilIdx = 0;
  for (const name of ['base2.png', 'base3.png']) {
    const im = new Image();
    im.onload = () => boilFrames.push(name); // 미리 디코드해 두고 목록에 추가
    im.src = name;
  }
  setInterval(() => {
    boilIdx++;
    if (motionActive && currentMotion) {
      const fr = motionBoilFrames[currentMotion];
      if (fr && fr.length > 1) motionEl.src = fr[boilIdx % fr.length];
    } else if (boilFrames.length > 1 && layers['base'].ok) {
      layers['base'].el.src = boilFrames[boilIdx % boilFrames.length];
    }
  }, 220);

  // ---- 눈 깜빡임: 1~3초 랜덤 간격 ----
  let motionActive = false;

  let blinkResetTimer = null;
  function doBlink(ms) {
    if (!layers['eyes-closed'].ok) return; // 감은 눈 그림이 없으면 깜빡임 없음
    document.body.classList.add('blink');
    // 이전 깜빡임의 리셋 타이머가 남아 있으면 이번 깜빡임을 도중에 꺼버린다
    clearTimeout(blinkResetTimer);
    blinkResetTimer = setTimeout(
      () => document.body.classList.remove('blink'), ms || 130);
  }
  (function blinkLoop() {
    setTimeout(() => {
      // 부품 모드에서는 동작 중에도 눈이 얹혀 있으므로 계속 깜빡인다.
      // 호환 모드(전체 그림)에서는 동작 중 부품이 숨겨지므로 쉰다.
      const legacy = document.body.classList.contains('legacy');
      if (!(motionActive && legacy)) doBlink();
      blinkLoop();
    }, 1000 + Math.random() * 2000); // 1~3초
  })();

  // ---- 동작: motions 폴더의 이미지를 확률·시간 설정대로 재생 ----
  const motionEl = document.getElementById('motion');
  let motionCfg = { interval: 8, items: {} }; // items[파일명] = { prob: %, dur: 초 }
  let motionFiles = [];
  let currentMotion = null;
  const preloadedMotions = {};
  const motionBoilFrames = {}; // 파일명 → [원본, 로드된 떨림 프레임 경로들]

  function preloadMotion(name) {
    if (preloadedMotions[name]) return;
    const im = new Image();
    im.src = 'motions/' + name;
    preloadedMotions[name] = im;

    // 떨림 프레임(motions/boil/<이름>.2.png, .3.png)이 있으면 같이 준비
    const stem = name.replace(/\.png$/i, '');
    motionBoilFrames[name] = ['motions/' + name];
    for (const v of [2, 3]) {
      const b = new Image();
      const p = `motions/boil/${stem}.${v}.png`;
      b.onload = () => motionBoilFrames[name].push(p);
      b.src = p;
    }
  }

  let motionEndTimer = null;
  function playMotion(name) {
    if (motionActive) return;
    const item = motionCfg.items[name] || { dur: 2 };
    motionActive = true;
    currentMotion = name;
    preloadMotion(name); // 강제 재생 등 목록 밖 경로 대비
    motionEl.src = 'motions/' + name;
    document.body.classList.add('motion-on');
    clearTimeout(motionEndTimer);
    motionEndTimer = setTimeout(() => {
      document.body.classList.remove('motion-on');
      motionActive = false;
      currentMotion = null;
    }, Math.max(0.3, item.dur || 2) * 1000);
  }

  // 동작이 나오는 방식: 'random'(시간마다 확률) 또는 'loud'(목소리를 높였을 때)
  const isLoudTrigger = () => motionCfg.trigger === 'loud';

  // 목소리를 확 높였을 때 호출된다 (오디오 루프에서, '큰 소리' 방식일 때만).
  // 여러 동작이 켜져 있으면 '비중(%)'대로 하나를 고른다.
  function triggerLoudMotion() {
    if (motionActive) return;
    const names = motionFiles.filter((n) => (motionCfg.items[n]?.prob || 0) > 0);
    if (!names.length) return;
    const total = names.reduce((s, n) => s + motionCfg.items[n].prob, 0);
    let r = Math.random() * total;
    for (const n of names) {
      r -= motionCfg.items[n].prob;
      if (r < 0) { playMotion(n); return; }
    }
  }

  // '랜덤' 방식: interval 초마다 주사위를 굴려 각 동작의 확률(%)대로 등장.
  // 확률 합이 100을 넘으면 비율대로 나눠 가진다.
  let motionTimer = null;
  function startMotionLoop() {
    clearInterval(motionTimer);
    if (isLoudTrigger()) return;
    const sec = Math.min(120, Math.max(2, motionCfg.interval || 8));
    motionTimer = setInterval(() => {
      if (motionActive) return;
      const names = motionFiles.filter((n) => (motionCfg.items[n]?.prob || 0) > 0);
      if (!names.length) return;
      const total = names.reduce((s, n) => s + motionCfg.items[n].prob, 0);
      const scale = total > 100 ? 100 / total : 1;
      let r = Math.random() * 100;
      for (const n of names) {
        r -= motionCfg.items[n].prob * scale;
        if (r < 0) { playMotion(n); break; }
      }
    }, sec * 1000);
  }

  // 마이크마다 출력 레벨이 크게 다르므로 고정 임계값을 쓰지 않고
  // 주변 소음(floor)과 목소리 최대치(ceil)를 계속 추적해서 그 사이를 0~1로 매핑한다.
  // 조용할 때의 기준선. 일부러 높게 시작해서 조용한 순간에 빠르게 내려오게 한다.
  // 낮게 시작하면, 일정한 잡음이 그보다 살짝 높을 때 잡음을 '말'로 판정하고
  // (말하는 중엔 기준선을 안 올리므로) 영영 못 빠져나오는 교착에 빠진다.
  const FLOOR_START = 0.02;
  let floor = FLOOR_START;
  let ceil  = 0.04;    // 말할 때의 최대치
  const CEIL_MIN = 0.015; // ceil 이 너무 낮아져 소음에 반응하는 것 방지
  // ceil 감쇠. 너무 느리면(0.9993 = 반감기 33초) 한 번 크게 말한 뒤
  // 30초 가까이 보통 목소리에 반응하지 않는다.
  const CEIL_DECAY = 0.995; // 반감기 약 4.6초
  let sens = 1.8;      // 민감도 (사용자가 우클릭 UI 에서 조절)

  let level = 0;     // 진단 막대용 음량 포락선 (0~1)
  let localAvg = 0;  // 최근 음량 평균 — 음절 뻥긋 기준선
  let flapOpen = false; // 현재 틱의 입 상태
  // 큰 소리(강조) 판정용 — 말하는 틱만 모은다
  let loudHist = [];   // 최근 15초(450틱) 음량 — 평소 목소리 기준선
  let loudRecent = []; // 최근 0.2초(6틱) 음량
  let loudBase = 0;    // 기준선 = loudHist 의 상위 10% 값
  let loudScore = 0;
  let loudPeak = 0, loudPeakAt = 0; // 최근 8초 최고 점수 (화면 표시용)
  let lastMotionAt = 0;
  function percentile(arr, p) {
    const s = arr.slice().sort((a, b) => a - b);
    return s[Math.min(s.length - 1, Math.floor(s.length * p))];
  }

  // 두 그림을 섞으면 반투명하게 겹쳐 보여 어색하므로 딱 둘 중 하나만 보여준다.
  // 경계에서 깜빡이지 않도록 열림/닫힘 기준을 다르게 둔다(히스테리시스).
  const OPEN_AT  = 0.40;
  const CLOSE_AT = 0.22;
  let isOpen = false;

  // 매 프레임 도는 렌더 루프는 두지 않는다. 입 상태가 실제로 바뀔 때만
  // DOM 을 건드린다 — 말하지 않는 동안에는 아무 일도 하지 않는다.
  function setMouth(open) {
    if (open === isOpen) return;
    isOpen = open;
    document.body.classList.toggle('talking', open);
  }
  // 캡처/디버그용 강제값(0~1) 경로에서만 쓰는 문턱 변환
  function applyLevel(lv) {
    setMouth(isOpen ? lv >= CLOSE_AT : lv > OPEN_AT);
  }

  // ---- 마이크 → 음량 → 입 ----
  // ---- 조작판(별도 창) 연결 ----
  // 조작 UI 는 control.html 창에 있다. 캐릭터 창은 우클릭하면 조작판을 연다.
  // 조작판이 보일 때만 진단 숫자를 계산해서 보낸다(평소엔 비용 없음).
  let uiVisible = false;
  window.buddy.onControlVisible((v) => { uiVisible = !!v; });
  window.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.buddy.openControl();
  });

  // 캡처/디버그용: body 에 data-force-level 이 있으면 마이크 값 대신 그 값을 쓴다.
  // 평소에는 콜백이 아예 호출되지 않으므로 비용이 없다.
  let forcedLevel = null;
  new MutationObserver(() => {
    const f = document.body.dataset.forceLevel;
    forcedLevel = f === undefined ? null : parseFloat(f);
    if (forcedLevel !== null) applyLevel(forcedLevel);
  }).observe(document.body, { attributes: true, attributeFilter: ['data-force-level'] });

  // 캡처/디버그용: data-force-motion="파일명" → 그 동작 재생,
  // data-force-blink="지속ms" → 눈 감기
  new MutationObserver(() => {
    const m = document.body.dataset.forceMotion;
    if (m) { delete document.body.dataset.forceMotion; playMotion(m); }
    const b = document.body.dataset.forceBlink;
    if (b) { delete document.body.dataset.forceBlink; doBlink(parseInt(b, 10) || 800); }
  }).observe(document.body, {
    attributes: true,
    attributeFilter: ['data-force-motion', 'data-force-blink'],
  });

  // ---- 오디오 입력: 마이크 / PC 사운드 ----
  // 입력 스트림만 갈아끼우고, 분석 루프는 하나로 계속 돈다.
  let audioMode = 'mic';   // 'mic' | 'pc'
  let ctx = null, analyser = null, curStream = null, devName = '';
  let rmsLog = null; // 개발용: 배열을 넣으면 매 틱 rms 를 기록한다
  const buf = new Float32Array(256);

  function resetAdaptive() {
    // 입력이 바뀌면 소음·목소리 기준을 새로 잡는다
    floor = FLOOR_START; ceil = 0.04; level = 0; localAvg = 0; peak = 0;
    loudHist = []; loudRecent = []; loudBase = 0; loudScore = 0; flapOpen = false;
    loudPeak = 0; loudPeakAt = 0;
    setMouth(false);
  }

  async function openStream(mode) {
    if (mode === 'pc') {
      // 윈도우 시스템 소리(스피커로 나가는 소리)를 루프백으로 받는다.
      // 화면 트랙이 반드시 딸려오므로 받자마자 끄고 오디오만 쓴다.
      const s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      s.getVideoTracks().forEach((t) => t.stop());
      if (!s.getAudioTracks().length) throw new Error('PC 사운드 트랙을 받지 못했습니다');
      return s;
    }
    // 에코 제거: PC 에서 나는 소리가 마이크로 새어 들어가도 입이 반응하지 않게 한다.
    // (window.__devNoAEC 는 스피커 소리로 마이크 모드를 시험할 때만 쓰는 개발용 스위치)
    return navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: !window.__devNoAEC, noiseSuppression: true, autoGainControl: false },
    });
  }

  let audioGen = 0; // 입력 전환 세대 번호
  async function startAudio(mode) {
    // 장치 열기는 느릴 수 있다. 여는 도중 다시 전환되면(버튼 연타, 시작 직후
    // 전환) 늦게 열린 이전 입력이 새 입력을 덮어써서 버튼은 'PC 사운드'인데
    // 실제로는 마이크를 듣는 일이 생긴다. 세대 번호로 낡은 결과를 버린다.
    const gen = ++audioGen;

    // 이전 입력 정리
    analyser = null;
    if (curStream) curStream.getTracks().forEach((t) => t.stop());
    if (ctx) { try { await ctx.close(); } catch {} }
    curStream = null; ctx = null;
    resetAdaptive();
    audioMode = mode;

    try {
      const stream = await openStream(mode);
      if (gen !== audioGen) { stream.getTracks().forEach((t) => t.stop()); return; }
      const track = stream.getAudioTracks()[0];
      devName = mode === 'pc' ? 'PC 사운드'
                              : (track ? track.label || '(이름 없음)' : '(트랙 없음)');

      // 립싱크에는 높은 샘플레이트가 필요 없다. 낮추면 오디오 스레드 부담이 준다.
      const c = new AudioContext({ sampleRate: 16000, latencyHint: 'playback' });
      // AudioContext 는 suspended 로 시작하는 경우가 있다. 반드시 깨워야
      // analyser 에 데이터가 흘러든다.
      if (c.state !== 'running') await c.resume();

      const src = c.createMediaStreamSource(stream);
      const a = c.createAnalyser();
      a.fftSize = 256;          // 음량만 보면 되므로 작게 (1024 → 256)
      // 스무딩이 강하면 음절 사이의 에너지 골짜기가 뭉개져
      // 문장 내내 입을 벌리고 있게 된다. 낮게 잡아 음절 리듬을 살린다.
      a.smoothingTimeConstant = 0.15;
      src.connect(a);

      if (gen !== audioGen) {
        stream.getTracks().forEach((t) => t.stop());
        c.close();
        return;
      }
      curStream = stream; ctx = c; analyser = a;
    } catch (e) {
      if (gen !== audioGen) return; // 이미 다른 입력으로 넘어갔으면 오류 안내도 생략
      const what = mode === 'pc' ? 'PC 사운드를' : '마이크를';
      // 맥은 시스템 소리 루프백을 지원하지 않는다. 원인을 모른 채
      // 오류 문구만 보고 헤매지 않도록 해결 방법을 알려준다.
      const isMac = navigator.userAgent.includes('Mac OS X');
      const hint = mode === 'pc' && isMac
        ? '<br><br>맥은 PC 소리를 직접 받을 수 없습니다.<br>' +
          '[입력: 마이크] 로 바꿔서 쓰시거나,<br>BlackHole 같은 가상 오디오 장치를 설치하세요.'
        : (mode === 'mic' && isMac
            ? '<br><br>맥 [시스템 설정] → [개인정보 보호 및 보안] →<br>[마이크] 에서 허용해 주세요.'
            : '');
      showMsg(what + ' 열 수 없습니다.<br>' + e.name + ': ' + e.message + hint);
    }
  }

  let ticks = 0;
  // 입 모양은 초당 30번만 갱신해도 충분하다.
  setInterval(() => {
      if (!analyser) return;
      {
        // 브라우저가 도중에 다시 재웠으면 깨운다
        if (ctx.state === 'suspended') ctx.resume();

        // 반드시 32비트로 읽는다. 8비트로 읽으면 반올림 때문에 무음에서도
        // 0.0055 짜리 가짜 잡음이 깔리는데, 출력이 작은 마이크(말소리 0.005~0.016)는
        // 목소리가 거기 묻혀 큰 소리 판정이 아예 불가능해진다 (실측 확인).
        analyser.getFloatTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        const rms = Math.sqrt(sum / buf.length);
        if (rms > peak) peak = rms;
        if (rmsLog) rmsLog.push(rms); // 튜닝용 기록 (평소엔 null 이라 비용 없음)

        // 무음 판정선. 민감도가 이 선까지 같이 낮춰야 한다.
        // (예전처럼 gate 통과 뒤에만 민감도를 곱하면, 목소리가 gate 아래일 때
        //  민감도를 아무리 올려도 결과가 정확히 0 이라 슬라이더가 먹통이 된다.)
        // 다만 주변 소음보다는 항상 일정 비율 위에 있어야 소음에 반응하지 않는다.
        // 0.0006 은 절대 하한 — 이 마이크의 무음 구간 최대치(0.0004, 실측)보다 위.
        // 민감도를 최대로 올려도 방 잡음에 입이 움직이지 않게 한다.
        const gate = Math.max((floor * 1.6 + 0.0015) / sens, floor * 1.5, 0.0006);

        // 소음 기준선: 조용해지면 빠르게 따라 내려간다.
        // 말하는 중에는 올리지 않는다 — 목소리가 스스로 기준선을 끌어올려
        // 점점 둔해지는 것을 막기 위해서다.
        const speaking = rms > gate;
        floor += (rms - floor) * (rms < floor ? 0.05 : (speaking ? 0 : 0.0006));

        // 목소리 최대치: 큰 소리는 즉시 반영, 이후 서서히 감쇠.
        ceil = Math.max(rms, ceil * CEIL_DECAY, floor * 3, CEIL_MIN);

        const span = Math.max(ceil - gate, 0.008);  // 0 나눗셈 방지
        let target = rms <= gate ? 0 : Math.min(1, ((rms - gate) / span) * sens);

        // level 은 진단 막대 표시용 음량 포락선
        const k = target > level ? 0.75 : 0.38;
        level += (target - level) * k;

        // --- 음절 뻥긋 ---
        // "소리 나는 동안 = 계속 벌림"이 아니라, 최근 평균(localAvg)보다
        // 에너지가 솟는 순간 열고 꺼지는 순간 닫아서 음절마다 여닫는다.
        // ("안녕하세요" → 5번 뻥긋)
        localAvg += (rms - localAvg) * 0.25;
        // 소음의 잔떨림에는 반응하지 않도록 최소 상승폭도 요구한다.
        const eps = Math.max(0.0012, floor * 1.2) / sens;
        if (!speaking) flapOpen = false;
        else if (rms > localAvg * 1.08 && rms > localAvg + eps) flapOpen = true;
        else if (rms < localAvg * 0.92) flapOpen = false;
        // 그 사이 구간에서는 이전 상태 유지 (경계 떨림 방지)

        if (forcedLevel !== null) applyLevel(forcedLevel);
        else setMouth(flapOpen);

        // --- 큰 소리(강조) → 동작 ---
        // 점수 = 최근 0.2초(말하는 6틱)의 최고 음량 ÷ 최근 15초 평소 목소리의
        //        상위 10% 음량. 점수가 기준(기본 2.3배)을 넘으면 동작.
        // 평균끼리 비교하는 방식은 평소 말도 구절마다 음량이 출렁여서
        // 평소 말과 큰 소리를 가르지 못했다 (실측 기록 2개로 확인:
        // 이 방식은 평소 최대 1.75 / 큰 소리 최소 3.04 로 확실히 갈린다).
        if (speaking) {
          loudRecent.push(rms);
          if (loudRecent.length > 6) loudRecent.shift();
          if (loudHist.length >= 150) {
            // 기준선이 잡음 수준까지 떨어져 점수가 폭주하지 않도록 하한을 둔다
            // (실제 말소리의 상위 10%는 무음 판정선보다 수십 배 크다)
            loudBase = Math.max(percentile(loudHist, 0.9), gate * 3);
            loudScore = Math.max(...loudRecent) / loudBase;
          }
          // 큰 소리가 기준선을 곧바로 끌어올리지 않도록 기준선의 1.3배로 깎아 넣는다
          loudHist.push(loudHist.length >= 150 ? Math.min(rms, loudBase * 1.3) : rms);
          if (loudHist.length > 450) loudHist.shift();

          if (isLoudTrigger() && loudHist.length >= 150 && !motionActive &&
              loudScore > (motionCfg.loudRatio || 2.3) &&
              Date.now() - lastMotionAt > (motionCfg.interval || 8) * 1000) {
            lastMotionAt = Date.now();
            triggerLoudMotion();
          }
        }

        // 최근 8초 최고 점수 (외쳤을 때 몇 점까지 가는지 보여주기용)
        const nowMs = Date.now();
        if (loudScore >= loudPeak || nowMs - loudPeakAt > 8000) {
          loudPeak = loudScore; loudPeakAt = nowMs;
        }

        // 진단 숫자는 조작판이 열려 있을 때만 만들어 보낸다 (초당 10번).
        if (uiVisible && ++ticks % 3 === 0) {
          window.buddy.sendDiag({
            ready: loudHist.length >= 150,
            waitSec: Math.ceil((150 - loudHist.length) / 30),
            score: loudScore,
            peak: loudPeak,
            need: motionCfg.loudRatio || 2.3,
            state: ctx.state,
            rms, floor, localAvg,
            open: flapOpen,
            dev: devName,
            level,
          });
        }
      }
  }, 33);


  // ---- 조작판에서 바꾼 값 적용 ----
  function setChroma(on) {
    document.body.classList.toggle('chroma', !!on);
  }
  function applyMotionCfg(cfg) {
    motionCfg = Object.assign({ interval: 8, trigger: 'random', items: {} }, cfg || {});
    if (!motionCfg.items || typeof motionCfg.items !== 'object') motionCfg.items = {};
    startMotionLoop();
  }
  // motions 폴더를 다시 읽고 미리 불러 둔다 (파일을 추가했을 수 있으므로)
  async function loadMotions() {
    motionFiles = await window.buddy.listMotions();
    motionFiles.forEach(preloadMotion);
  }

  window.buddy.onApplySensitivity((v) => {
    if (typeof v === 'number') sens = Math.max(0.8, Math.min(6, v));
  });
  window.buddy.onApplyAudioSource((v) => {
    const next = v === 'pc' ? 'pc' : 'mic';
    if (next !== audioMode || !analyser) startAudio(next);
  });
  window.buddy.onApplyChroma((on) => setChroma(on));
  window.buddy.onApplyMotionConfig((cfg) => { applyMotionCfg(cfg); loadMotions(); });
  window.buddy.onPlayMotion((name) => playMotion(name));

  window.buddy.getSettings().then(async (s) => {
    if (s && typeof s.sensitivity === 'number') sens = Math.max(0.8, Math.min(6, s.sensitivity));
    startAudio(s && s.audioSource === 'pc' ? 'pc' : 'mic');
    if (s && s.chroma) setChroma(true);
    if (s && s.motionConfig && typeof s.motionConfig === 'object') applyMotionCfg(s.motionConfig);
    else startMotionLoop();
    await loadMotions();
  });

  // ---- 크기 조절 (캐릭터 위에서 휠·키보드) ----
  const STEP = 1.12;                 // 한 번에 12%씩
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    window.buddy.resizeBy(e.deltaY < 0 ? STEP : 1 / STEP);
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.key === '+' || e.key === '=') window.buddy.resizeBy(STEP);
    else if (e.key === '-' || e.key === '_') window.buddy.resizeBy(1 / STEP);
    else if (e.key === '0') window.buddy.resizeTo(340);
  });

  // ---- 드래그로 창 옮기기 (직접 구현) ----
  const stage = document.getElementById('stage');
  let dragging = false;

  stage.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    stage.setPointerCapture(e.pointerId); // 창 밖으로 나가도 계속 추적
    window.buddy.dragStart(e.screenX, e.screenY);
    e.preventDefault();
  });

  stage.addEventListener('pointermove', (e) => {
    if (dragging) window.buddy.dragMove(e.screenX, e.screenY);
  });

  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    try { stage.releasePointerCapture(e.pointerId); } catch {}
  };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
</script>
